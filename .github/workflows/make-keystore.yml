name: Tạo khóa ký release (chạy một lần)

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo keystore và danh sách secrets
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore lyriva-release.keystore \
            -storepass "$PASS" -keypass "$PASS" -alias lyriva \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=LYRIVA,O=N-Infinity,C=VN"
          {
            echo "LYRIVA_KEYSTORE_PASSWORD=$PASS"
            echo "LYRIVA_KEY_ALIAS=lyriva"
            echo "LYRIVA_KEY_PASSWORD=$PASS"
            echo "LYRIVA_KEYSTORE_BASE64=$(base64 -w0 lyriva-release.keystore)"
          } > secrets.txt

      - name: Tải file secrets lên (chỉ giữ 1 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: LYRIVA-signing-secrets
          path: secrets.txt
          retention-days: 1
